# OpsPilot Redis Configuration
# =============================

# Network
bind 0.0.0.0
port 6379
protected-mode no

# Memory Management
maxmemory 1gb
maxmemory-policy allkeys-lru

# Persistence
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB snapshots
save 900 1
save 300 10
save 60 10000

# Logging
loglevel notice

# Security (set password in production)
# requirepass your-redis-password

# Performance
tcp-keepalive 300
timeout 0

# Limits
maxclients 10000
