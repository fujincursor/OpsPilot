<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>设置 - 基本信息 - 运维 Agent 工作台</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout">
    <header class="header">
      <div class="header-left">
        <span class="logo">运维 Agent 工作台</span>
        <a href="project-list.html" class="nav-link">项目管理</a>
        <a href="#" class="nav-link">工作台</a>
      </div>
      <div class="header-right">
        <div class="user-avatar">用</div>
      </div>
    </header>
    <div class="layout-body">
    <aside class="sidebar">
      <nav class="sidebar-nav">
        <div class="sidebar-title">当前项目</div>
        <a href="project-detail.html" class="">概览</a>
        <a href="#">需求</a>
        <a href="project-settings-basic.html" class="active">设置</a>
      </nav>
    </aside>
    <main class="main-wrap">
      <div class="content" style="max-width: 720px">
        <h1 class="page-title">项目设置</h1>
        <div class="tabs">
          <a href="project-settings-basic.html" class="active">基本信息</a>
          <a href="project-settings-agent.html">Agent 配置</a>
          <a href="project-settings-members.html">成员管理</a>
          <a href="project-settings-advanced.html">高级</a>
        </div>
        <div class="form-card">
          <h2 class="card-title" style="margin-top:0">基本信息</h2>
          <div class="form-item">
            <label class="form-label"><span class="required">*</span> 项目名称</label>
            <input type="text" class="input" value="运维平台后端" placeholder="请输入项目名称">
          </div>
          <div class="form-item">
            <label class="form-label">项目简介</label>
            <textarea class="input" rows="3" placeholder="选填">后端服务与运维脚本统一管理仓库。</textarea>
          </div>
          <div class="form-item">
            <label class="form-label"><span class="required">*</span> 代码库地址</label>
            <input type="text" class="input" value="https://github.com/org/ops-backend.git" placeholder="如 https://github.com/org/repo.git">
          </div>
          <div class="form-item">
            <label class="form-label">默认分支</label>
            <input type="text" class="input" value="main" placeholder="main">
          </div>
          <div class="form-item">
            <label class="form-label">环境类型</label>
            <select class="input">
              <option selected>开发</option>
              <option>测试</option>
              <option>预发</option>
              <option>生产</option>
            </select>
          </div>
          <div class="form-actions">
            <a href="project-detail.html" class="btn btn-secondary">取消</a>
            <button type="button" class="btn btn-primary">保存</button>
          </div>
        </div>
      </div>
    </main>
    </div>
  </div>
</body>
</html>
