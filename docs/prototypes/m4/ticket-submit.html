<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>提交需求 - 运维 Agent 工作台</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout">
    <header class="header">
      <div class="header-left">
        <span class="logo">运维 Agent 工作台</span>
        <a href="../m1/project-list.html" class="nav-link">项目管理</a>
        <a href="#" class="nav-link active">工作台</a>
      </div>
      <div class="header-right">
        <div class="user-avatar">用</div>
      </div>
    </header>
    <div class="layout-body">
      <aside class="sidebar">
        <nav class="sidebar-nav">
          <div class="sidebar-title">当前项目</div>
          <a href="../m1/project-detail.html">概览</a>
          <a href="ticket-list.html" class="active">需求</a>
          <a href="../m1/project-settings-basic.html">设置</a>
        </nav>
      </aside>
      <main class="main-wrap">
        <div class="content" style="max-width: 560px">
          <div class="breadcrumb">
            <a href="../m1/project-list.html">项目管理</a> / <a href="../m1/project-detail.html">运维平台后端</a> / <a href="ticket-list.html">需求</a> / <span>提交需求</span>
          </div>
          <h1 class="page-title">提交需求</h1>
          <div class="form-card">
            <p class="meta" style="margin-bottom: 16px">提交后将由 Agent 自动分析并区分为 Bug 或新需求，并进入对应流程。</p>
            <div class="form-item">
              <label class="form-label"><span class="required">*</span> 需求标题</label>
              <input type="text" class="input" placeholder="简要描述需求或问题">
            </div>
            <div class="form-item">
              <label class="form-label"><span class="required">*</span> 需求描述</label>
              <textarea class="input" placeholder="请详细描述现象、复现步骤或期望效果，便于 Agent 分析" rows="5"></textarea>
            </div>
            <div class="form-item">
              <label class="form-label">附件</label>
              <div class="input" style="height: auto; padding: 12px; color: var(--text-secondary);">
                点击上传或拖拽文件至此处（可选截图、日志等）
              </div>
            </div>
            <div class="form-actions">
              <a href="ticket-list.html" class="btn btn-secondary">取消</a>
              <button type="button" class="btn btn-primary">提交</button>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
