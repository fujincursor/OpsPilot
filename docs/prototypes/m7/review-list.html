<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待审列表 - Review 工作台 - 运维 Agent 工作台</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout">
    <header class="header">
      <div class="header-left">
        <span class="logo">运维 Agent 工作台</span>
        <a href="../m1/project-list.html" class="nav-link">项目管理</a>
        <a href="#" class="nav-link">工作台</a>
        <a href="review-list.html" class="nav-link active">Review</a>
      </div>
      <div class="header-right">
        <div class="user-avatar">用</div>
      </div>
    </header>
    <div class="layout-body">
      <aside class="sidebar">
        <nav class="sidebar-nav">
          <div class="sidebar-title">Review</div>
          <a href="review-list.html" class="active">待审列表</a>
        </nav>
      </aside>
      <main class="main-wrap">
        <div class="content">
          <h1 class="page-title">Review 工作台</h1>
          <div class="filter-bar">
            <div class="form-item">
              <select class="input input-sm">
                <option>全部项目</option>
                <option>运维平台后端</option>
                <option>前端监控系统</option>
              </select>
            </div>
            <div class="form-item">
              <select class="input input-sm">
                <option>全部类型</option>
                <option>方案</option>
                <option>代码</option>
                <option>测试报告</option>
              </select>
            </div>
            <button type="button" class="btn btn-secondary">查询</button>
            <a href="#" class="btn btn-link">重置</a>
          </div>
          <div class="table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th>工单标题</th>
                  <th style="width:120px">项目</th>
                  <th style="width:100px">待审类型</th>
                  <th style="width:140px">就绪时间</th>
                  <th style="width:100px">操作</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>
                    <a href="review-detail-plan.html" class="link">登录接口偶发超时</a>
                    <div class="meta">Bug · 张三提交</div>
                  </td>
                  <td>运维平台后端</td>
                  <td><span class="tag tag-info">方案</span></td>
                  <td class="meta">2025-03-04 11:00</td>
                  <td>
                    <a href="review-detail-plan.html" class="link">去 Review</a>
                  </td>
                </tr>
                <tr>
                  <td>
                    <a href="review-detail-code.html" class="link">用户权限校验逻辑优化</a>
                    <div class="meta">新需求 · 李四提交</div>
                  </td>
                  <td>运维平台后端</td>
                  <td><span class="tag tag-default">代码</span></td>
                  <td class="meta">2025-03-04 10:30</td>
                  <td>
                    <a href="review-detail-code.html" class="link">去 Review</a>
                  </td>
                </tr>
                <tr>
                  <td>
                    <a href="review-detail-test.html" class="link">监控大盘接口超时告警</a>
                    <div class="meta">Bug · 王五提交</div>
                  </td>
                  <td>前端监控系统</td>
                  <td><span class="tag tag-warning">测试报告</span></td>
                  <td class="meta">2025-03-03 16:20</td>
                  <td>
                    <a href="review-detail-test.html" class="link">去 Review</a>
                  </td>
                </tr>
              </tbody>
            </table>
            <div class="pagination">
              <span>共 3 条</span>
              <div class="actions">
                <select class="input" style="width:80px; height:32px">
                  <option>10 条/页</option>
                  <option>20 条/页</option>
                  <option>50 条/页</option>
                </select>
                <button type="button" class="btn btn-secondary" disabled>上一页</button>
                <button type="button" class="btn btn-secondary">下一页</button>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
