# OpsPilot 配置文件 - 基于 DeerFlow 框架
# 此配置定义了 OpsPilot 运维领航的 Agent 系统

config_version: 1

# ============================================================================
# 日志配置
# ============================================================================
log_level: info

logging:
  enhance:
    enabled: true
    format: text

# ============================================================================
# Token 用量统计
# ============================================================================
token_usage:
  enabled: true

# ============================================================================
# Token 预算限制
# ============================================================================
token_budget:
  enabled: true
  max_tokens: 100000
  warn_threshold: 0.8
  hard_stop_threshold: 1.0

# ============================================================================
# 递归限制
# ============================================================================
recursion_limit: 100
max_recursion_limit: 500

# ============================================================================
# 模型配置
# ============================================================================
models:
  # OpenAI GPT-4
  - name: gpt-4o
    display_name: GPT-4o
    use: langchain_openai:ChatOpenAI
    model: gpt-4o
    api_key: $OPENAI_API_KEY
    timeout: 300.0
    max_retries: 2
    max_tokens: 4096
    supports_thinking: false
    supports_vision: true

  # DeepSeek
  - name: deepseek-v3
    display_name: DeepSeek V3
    use: langchain_openai:ChatOpenAI
    model: deepseek-chat
    api_key: $DEEPSEEK_API_KEY
    base_url: https://api.deepseek.com
    timeout: 300.0
    max_retries: 2
    max_tokens: 4096

  # Claude (可选)
  - name: claude-sonnet
    display_name: Claude Sonnet 3.5
    use: langchain_anthropic:ChatAnthropic
    model: claude-3-5-sonnet-20241022
    api_key: $ANTHROPIC_API_KEY
    timeout: 300.0
    max_retries: 2
    max_tokens: 4096
    supports_thinking: true
    supports_vision: true

# ============================================================================
# 工具配置
# ============================================================================
tools:
  # 网页搜索
  - name: web_search
    enabled: true
    group: search
    use: deerflow.tools.builtins.tavily_search:TavilySearchTool
    config:
      api_key: $TAVILY_API_KEY
      max_results: 5

  # 网页抓取
  - name: web_fetch
    enabled: true
    group: search
    use: deerflow.tools.builtins.web_fetch:WebFetchTool

  # 文件操作
  - name: read_file
    enabled: true
    group: filesystem
    use: deerflow.tools.builtins.filesystem:ReadFileTool

  - name: write_file
    enabled: true
    group: filesystem
    use: deerflow.tools.builtins.filesystem:WriteFileTool

  - name: list_files
    enabled: true
    group: filesystem
    use: deerflow.tools.builtins.filesystem:ListFilesTool

  # Bash 执行
  - name: bash
    enabled: true
    group: execution
    use: deerflow.tools.builtins.bash:BashTool
    config:
      timeout: 60
      allowed_commands:
        - python
        - pytest
        - pip
        - npm
        - node
        - git
        - curl
        - cat
        - ls
        - grep

  # 代码执行
  - name: python_repl
    enabled: true
    group: execution
    use: deerflow.tools.builtins.python_repl:PythonReplTool
    config:
      timeout: 60

# ============================================================================
# Skills 配置
# ============================================================================
skills:
  # Skills 目录路径
  paths:
    - skills/opspilot
    - deerflow/skills/public

  # 默认启用的 Skills
  enabled:
    - requirement-analysis
    - bugfix-solution
    - feature-design
    - code-generation
    - test-execution
    - knowledge-retrieval
    - deep-research

# ============================================================================
# Sub-Agents 配置
# ============================================================================
subagents:
  enabled: true
  max_concurrent: 3
  
  agents:
    # 需求分析 Agent
    - name: requirement_analyzer
      display_name: 需求分析 Agent
      description: 分析运维需求，进行分类和优先级评估
      skills:
        - requirement-analysis
        - knowledge-retrieval
      
    # Bug 修复 Agent
    - name: bugfix_agent
      display_name: Bug 修复 Agent
      description: 针对 Bug 类型需求生成修复方案
      skills:
        - bugfix-solution
        - code-generation
        - test-execution
      
    # 功能设计 Agent
    - name: feature_agent
      display_name: 功能设计 Agent
      description: 针对功能请求生成设计方案
      skills:
        - feature-design
        - deep-research
      
    # 代码生成 Agent
    - name: codegen_agent
      display_name: 代码生成 Agent
      description: 根据设计方案生成代码
      skills:
        - code-generation
        - test-execution
      
    # 测试 Agent
    - name: test_agent
      display_name: 测试 Agent
      description: 执行测试并验证代码变更
      skills:
        - test-execution

# ============================================================================
# Sandbox 配置
# ============================================================================
sandbox:
  mode: docker
  config:
    image: python:3.11-slim
    timeout: 300
    memory_limit: 512m
    network_mode: none
    working_dir: /workspace

# ============================================================================
# Memory 配置
# ============================================================================
memory:
  enabled: true
  mode: middleware
  backend: deermem
  backend_config:
    max_facts: 100
    consolidation_enabled: true

# ============================================================================
# HITL (Human-in-the-Loop) 配置
# ============================================================================
hitl:
  enabled: true
  require_approval:
    - feature-design
    - code-generation
  auto_approve:
    - bugfix-solution
    - test-execution

# ============================================================================
# 知识库配置
# ============================================================================
knowledge_base:
  enabled: true
  scope_selection_enabled: true
  
  # 本地文档索引
  local:
    enabled: true
    paths:
      - docs/
      - README.md
    
  # RAGFlow 集成 (可选)
  ragflow:
    enabled: false
    base_url: $RAGFLOW_BASE_URL
    api_key: $RAGFLOW_API_KEY

# ============================================================================
# API Gateway 配置
# ============================================================================
gateway:
  host: 0.0.0.0
  port: 8001
  cors:
    enabled: true
    origins:
      - http://localhost:3000
      - http://localhost:8000

# ============================================================================
# 数据库配置
# ============================================================================
database:
  backend: sqlite
  connection:
    path: .opspilot/data/opspilot.db

# ============================================================================
# 调度器配置 (定时任务)
# ============================================================================
scheduler:
  enabled: false
  multi_instance: false
  max_concurrent_runs: 5

# ============================================================================
# 项目设置
# ============================================================================
projects:
  enabled: true
  instructions_max_bytes: 8192
  shelf_index_max_entries: 100
