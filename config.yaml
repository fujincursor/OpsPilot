# OpsPilot 配置文件 - 基于 DeerFlow 框架
# 此配置定义了 OpsPilot 运维领航的 Agent 系统

config_version: 65

# ============================================================================
# 日志配置
# ============================================================================
log_level: info

logging:
  enhance:
    enabled: true
    format: text

# ============================================================================
# Token 用量统计
# ============================================================================
token_usage:
  enabled: true

# ============================================================================
# Token 预算限制
# ============================================================================
token_budget:
  enabled: true
  max_tokens: 200000
  warn_threshold: 0.8
  hard_stop_threshold: 1.0

# ============================================================================
# 递归限制
# ============================================================================
recursion_limit: 100
max_recursion_limit: 500

# ============================================================================
# 模型配置
# ============================================================================
models:
  # OpenAI GPT-4o
  - name: gpt-4o
    display_name: GPT-4o
    use: langchain_openai:ChatOpenAI
    model: gpt-4o
    api_key: $OPENAI_API_KEY
    timeout: 300.0
    max_retries: 2
    max_tokens: 4096
    context_window: 128000
    supports_thinking: false
    supports_vision: true

  # DeepSeek V3
  - name: deepseek-v3
    display_name: DeepSeek V3
    use: langchain_deepseek:ChatDeepSeek
    model: deepseek-chat
    api_key: $DEEPSEEK_API_KEY
    timeout: 300.0
    max_retries: 2
    max_tokens: 4096

  # Claude Sonnet (可选)
  - name: claude-sonnet
    display_name: Claude Sonnet 3.5
    use: langchain_anthropic:ChatAnthropic
    model: claude-3-5-sonnet-20241022
    api_key: $ANTHROPIC_API_KEY
    timeout: 300.0
    max_retries: 2
    max_tokens: 4096
    supports_thinking: true
    supports_vision: true

# ============================================================================
# Sandbox 配置 (代码执行环境)
# ============================================================================
sandbox:
  use: deerflow.sandbox.local:LocalSandboxProvider
  allow_host_bash: true
  prewarm: false
  prewarm_max_concurrent: 1

# ============================================================================
# Sub-Agent 运行时配置
# ============================================================================
subagent_runtime:
  max_running: 3
  max_queued: 64
  admission_policy: queue
  queue_timeout_seconds: 300

# ============================================================================
# Sub-Agents 配置 (可选覆盖)
# ============================================================================
# subagents:
#   timeout_seconds: 1800
#   agents:
#     general-purpose:
#       timeout_seconds: 1200

# ============================================================================
# Skills 配置
# ============================================================================
skills:
  paths:
    - skills/opspilot

# ============================================================================
# Memory 配置
# ============================================================================
memory:
  enabled: true
  mode: middleware
  backend: deermem
  backend_config:
    max_facts: 100
    consolidation_enabled: true

# ============================================================================
# HITL (Human-in-the-Loop) 配置
# ============================================================================
hitl:
  enabled: false

# ============================================================================
# 知识库配置
# ============================================================================
knowledge_base:
  enabled: true
  scope_selection_enabled: true
  local:
    enabled: true
    paths:
      - docs/
      - knowledge-base/
      - README.md

# ============================================================================
# 数据库配置
# ============================================================================
database:
  backend: sqlite
  connection:
    path: .opspilot/data/opspilot.db
